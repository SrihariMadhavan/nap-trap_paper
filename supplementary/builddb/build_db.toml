organism = 'Homo sapiens'

[data.samples.hek293t_12h.runs]
JBR001255 = {replicate_name = 'B1', run_type = 'input'}
JBR001256 = {replicate_name = 'B2', run_type = 'input'}
JBR001257 = {replicate_name = 'B3', run_type = 'input'}
JBR001258 = {replicate_name = 'B4', run_type = 'input'}
JBR001259 = {replicate_name = 'B1', run_type = 'flag_pulldown'}
JBR001260 = {replicate_name = 'B2', run_type = 'flag_pulldown'}
JBR001261 = {replicate_name = 'B3', run_type = 'flag_pulldown'}
JBR001262 = {replicate_name = 'B4', run_type = 'flag_pulldown'}


# The next section defines how translation values are calculated for each samples
[data.functions]
calculate_delta = [{samples = ['pa_2hpf','pa_6hpf','hek293t_12h'], num_run_type = 'flag_pulldown', denom_run_type = 'input', data_type = 'translation'}] # Function to calculate translation values  
# samples = the samples to be includes for analyses, must be named as defined below in data.samples.X 
# num_run_type = run types to be used in numerator for translation calculation (initialised below)
# num_denom_type = run types to be used in denominator for translation calculation (initialised below) 
# data_type = tag to provide for the calculation

[data.spike_ins] # This section is for spikeins to be excluded from the analysis if required (names in the fasta file excluding the tag). Omit this section for samples using all spike-ins.
pa_2hpf = {spike_ins_to_exclude = ['ntrap_spike_3']}
pa_6hpf = {spike_ins_to_exclude = ['ntrap_spike_3']}



